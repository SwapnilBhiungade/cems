# ==========================================================
# kube-prometheus-stack Custom Values for CEMS Monitoring
# Install with:
# helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# helm repo update
# helm install cems-monitoring prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f monitoring/helm-values.yaml
# ==========================================================

defaultRules:
  create: true
  rules:
    k8sContainerSample: true
    k8sPodSample: true

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

grafana:
  enabled: true
  adminPassword: "AdminCemsSecurePass2026!"  # Update with strong password
  service:
    type: ClusterIP
    port: 80
  persistence:
    enabled: true
    size: 5Gi
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'cems-dashboards'
          orgId: 1
          folder: 'CEMS'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/cems

alertmanager:
  enabled: true
  alertmanagerSpec:
    retention: 120h

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
