apiVersion: v1
kind: ConfigMap
metadata:
  name: cems-config
  namespace: cems
  labels:
    app.kubernetes.io/name: cems
    app.kubernetes.io/component: backend
data:
  # Mode A (In-cluster MySQL): mysql-service.cems.svc.cluster.local
  # Mode B (AWS RDS): cems-mysql-db.xxxxxxxxx.ap-south-1.rds.amazonaws.com
  DB_HOST: "cems-mysql-db.xxxxxxxxx.ap-south-1.rds.amazonaws.com"
  DB_PORT: "3306"
  DB_NAME: "campus_events"
  DB_USER: "cems_admin"
  DEBUG: "false"
  ENABLE_METRICS: "true"
  SESSION_COOKIE_SECURE: "true"
  SESSION_COOKIE_SAMESITE: "Lax"
  PREFERRED_URL_SCHEME: "https"
  GUNICORN_WORKERS: "3"
  GUNICORN_THREADS: "2"
  GUNICORN_TIMEOUT: "60"
  CLOUDINARY_FOLDER: "cems-share/gallery"
