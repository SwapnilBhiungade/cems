apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: cems
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
