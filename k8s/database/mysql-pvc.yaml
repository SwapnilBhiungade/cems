apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: cems
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  # storageClassName: gp3  # On EKS with AWS EBS CSI Driver, or omit for default cluster StorageClass
  resources:
    requests:
      storage: 10Gi
