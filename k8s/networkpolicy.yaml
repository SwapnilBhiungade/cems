apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cems-network-policy
  namespace: cems
  labels:
    app.kubernetes.io/name: cems
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cems
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic to port 5000 from within cluster (ALB Ingress, Prometheus)
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5000
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow outbound traffic to MySQL (port 3306) and HTTPS for Cloudinary (port 443)
    - ports:
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 443
