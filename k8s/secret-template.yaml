apiVersion: v1
kind: Secret
metadata:
  name: cems-secret
  namespace: cems
  labels:
    app.kubernetes.io/name: cems
    app.kubernetes.io/component: backend
type: Opaque
# Note: Base64-encode the actual values or create via kubectl command:
# kubectl create secret generic cems-secret -n cems \
#   --from-literal=SECRET_KEY="your-64-char-hex-secret" \
#   --from-literal=DB_PASSWORD="your-strong-db-password" \
#   --from-literal=CLOUDINARY_URL="cloudinary://key:secret@cloud_name"
stringData:
  SECRET_KEY: "CHANGE_ME_IN_PRODUCTION_GENERATE_WITH_SECRETS_TOKEN_HEX"
  DB_PASSWORD: "CHANGE_ME_DATABASE_PASSWORD"
  CLOUDINARY_URL: "cloudinary://api_key:api_secret@cloud_name"
